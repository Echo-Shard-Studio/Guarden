[package]
name = "guarden"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["app/src-tauri"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] } # launcher_profiles.json, Prism's mmc-pack.json; keeps the launcher's key order

rusqlite = { version = "0.40.2", features = ["bundled"] } # Modrinth keeps its settings in SQLite

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7" # the sandbox: filesystem access rules the game can't lift
libc = "0.2" # seccomp, pidfd, process_vm_readv for the connect() supervisor

[package]
name = "guarden-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # generate_context! embeds the plugins config as JSON values
guarden = { path = "../.." }

[features]
# Serve the bundled frontend (app/src) instead of a dev server, also for plain `cargo build`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
